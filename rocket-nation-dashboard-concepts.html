.picker .pick select{font-size:17px;min-height:48px;max-width:440px;min-width:300px}
.picker p{max-width:56ch}.company-switch{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.picker{align-items:flex-end}.company-switch{margin-left:28px;padding-bottom:4px}.gallery-brand{margin:22px 0 18px;gap:18px}.gallery-brand .logo{width:clamp(48px,5vw,72px);height:clamp(48px,5vw,72px);flex:none}.gallery-brand h2{font-size:clamp(30px,3.4vw,48px);line-height:1.08;letter-spacing:-.5px}.gallery-brand .industry{font-size:clamp(26px,2.6vw,36px);line-height:1.2;margin-top:4px;color:var(--ink)}.value-case{margin:44px 0 28px;padding:clamp(28px,4vw,52px);background:#171a20;color:#fff;border-left:8px solid var(--accent);border-radius:10px}.value-case h2{font-size:clamp(28px,3.3vw,46px);line-height:1.12;letter-spacing:-.5px;max-width:34ch;text-wrap:balance;margin:0 0 18px;color:#fff;text-transform:none}.value-case p{font-size:clamp(18px,1.55vw,22px);line-height:1.5;max-width:60ch;margin:0;color:#e9ecef}.value-case p.value-case-close{font-size:clamp(28px,3.3vw,46px);line-height:1.12;letter-spacing:-.5px;font-weight:bold;color:#fff;max-width:34ch;margin-top:26px}@media(min-width:1200px){.picker{flex-wrap:nowrap}.picker .pick select{min-width:310px;max-width:330px}.company-switch{display:grid;grid-template-columns:repeat(2,max-content);gap:8px 10px;padding-bottom:0}.company-chip{padding:6px 14px 6px 10px;gap:8px;font-size:14px;white-space:nowrap}.picker{align-items:center}}@media(max-width:700px){.company-switch{margin-left:0}.card h2.role-title{font-size:21px}.value-case h2{font-size:24px}.value-case p{font-size:16px}.value-case p.value-case-close{font-size:24px}}.theme-lanternwood .value-case p.value-case-close{font-weight:600}.company-chip{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:6px 14px 6px 10px;border:2px solid var(--accent);border-radius:999px;background:#fff;color:var(--ink);font:inherit;font-size:14px;font-weight:bold;cursor:pointer}.company-chip:hover{background:var(--accent-soft)}.company-chip[aria-pressed="true"]{background:var(- /* Saltbox roofing: job-site production board */
.theme-saltbox{font-family:Bahnschrift,"Arial Narrow","Segoe UI",Arial,sans-serif}
.theme-saltbox h1{text-transform:uppercase;letter-spacing:.01em}
.theme-saltbox .gallery-title h1{text-transform:none}
.theme-saltbox .panel{border:0;border-top:5px solid #22272e;border-radius:0;background:#f6f3ef}
.theme-saltbox .panel h2{text-transform:uppercase;letter-spacing:.05em;font-size:15px}
.theme-saltbox .metrics{background:#22272e;color:#fff;border:0;border-radius:0;border-bottom:5px solid var(--accent);grid-template-columns:repeat(5,minmax(0,1fr))}
.theme-saltbox .metric{border-right:1px solid #3d454e}
.theme-saltbox .metric .muted{color:#cbd2d8}
.theme-saltbox .metric button{color:#ffb894}
.theme-saltbox .card,.theme-saltbox .picker{border-radius:0;border:0;border-top:5px solid var(--accent);background:#f6f3ef}
.theme-saltbox .action{border-left:0;border-top:3px solid var(--accent);background:#fff}
.theme-saltbox .fill{background:#22272e}.theme-saltbox .fill.hot{background:var(--accent)}
.sb-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px;align-items:start}
.sb-trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px;align-items:start}
.sb-grid>*,.sb-trio>*{min-width:0}.sb-trio>.panel+.panel,.sb-grid>.panel+.panel{margin-top:0}
.stages{display:grid;grid-template-columns:repeat(6,minmax(112px,1fr));gap:6px;min-width:700px}
.stage{background:#fff;border:1px solid #d8d1ca;min-height:150px}
.stage h3{background:#22272e;color:#fff;padding:7px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.stage h3 b{display:block;font-size:17px;letter-spacing:0;margin-top:2px}
.stage.done h3{background:var(--accent)}
button.chip{display:block;width:calc(100% - 12px);margin:6px;padding:6px 7px;border:0;border-left:4px solid var(--accent);border-radius:0;background:var(--accent-soft);font-size:12px;text-align:left;font-weight:700}
button.chip.ins{border-left-color:#22272e}button.chip span{display:block;font-weight:400;color:var(--muted);font-size:11px}
.stage .none{padding:10px 8px;font-size:12px;color:var(--muted)}
table.gantt{min-width:760px;table-layout:fixed;border-collapse:separate;border-spacing:3px}
table.gantt th,table.gantt td{border:0;padding:6px;font-size:12px;height:46px}
table.gantt thead th{background:#22272e;color:#fff;text-align:center;height:auto}
table.gantt thead th.today{background:var(--accent)}
table.gantt tbody th{background:#fff;width:150px;font-weight:700}
table.gantt td{background:#fff;color:var(--muted)}
table.gantt td.today{background:var(--accent);color:#fff;font-weight:700}
table.gantt td.planned{background:#5b3226;color:#fff;font-weight:700}
table.gantt td.done{background:#9aa1a8;color:#171a20}
table.gantt td.weather{background:repeating-linear-gradient(45deg,#fff2df,#fff2df 6px,#f1d1a4 6px,#f1d1a4 12px);color:#733b0f;font-weight:700}
table.gantt td.risk{box-shadow:inset 0 0 0 3px #f2b705}
table.gantt small{display:block;font-weight:400}
.wx{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.wx div{background:#fff;border:1px solid #d8d1ca;padding:7px 4px;font-size:11px;text-align:center}
.wx div.hold{background:#fff2df;border-color:#e4b77b}.wx div.high{background:#fbe2d8;border-color:#c0694a}
.wx b{display:block;font-size:12px}.wx svg{width:24px;height:24px;display:block;margin:3px auto;color:#22272e}
.big{display:block;font-size:34px;font-weight:700;line-height:1.1;letter-spacing:-.5px}
.site{background:#22272e;color:#fff;padding:16px}.site .big{color:#fff}.site p{color:#d9dee3;font-size:13px;margin:6px 0}.site button{margin-top:6px}
.crew-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;border-top:1px solid #d8d1ca;padding:10px 0;align-items:center;font-size:13px}
.crew-card p{font-size:12px;color:var(--muted);margin-top:2px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;margin-top:8px;color:var(--muted)}.legend i{display:inline-block;width:12px;height:12px;vertical-align:-2px;margin-right:4px}
/* Lanternwood care: soft rounded rings and day timelines */
.theme-lanternwood{font-family:"Segoe UI",Candara,Arial,sans-serif}
.theme-lanternwood h1,.theme-lanternwood h2{letter-spacing:0;font-weight:600}
.theme-lanternwood .panel{border:0;border-radius:18px;background:var(--accent-soft);padding:18px}
.theme-lanternwood .card,.theme-lanternwood .picker{border-radius:18px;border:0;background:var(--accent-soft)}
.theme-lanternwood .action{border-left:0;border-radius:12px;background:#fff;box-shadow:inset 4px 0 0 var(--accent)}
.theme-lanternwood .track{background:#fff;border-radius:6px}.theme-lanternwood .fill{border-radius:6px}
.lw-layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px;align-items:start}
.lw-two{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start;margin-bottom:16px}
@media(max-width:900px){.lw-layout,.lw-two{grid-template-columns:1fr}}
.lw-layout>*,.lw-two>*{min-width:0}.lw-two>.panel+.panel{margin-top:0}.lw-stack>.panel+.panel{margin-top:16px}
.rings{display:grid;gap:10px}
.rings .metric{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;align-items:center;background:#fff;border:2px solid var(--accent-soft);border-radius:18px;padding:12px}
.rings .metric strong{font-size:23px;letter-spacing:-.3px}
.rings .metric.plain{grid-template-columns:minmax(0,1fr)}
.theme-saltbox .metrics.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.ring{width:76px;height:76px;display:block}
.ring text{font:700 16px "Segoe UI",Arial,sans-serif;fill:#171a20}
.timeline{display:grid;grid-template-columns:118px minmax(560px,1fr);gap:7px 8px;align-items:center;font-size:12px}
.lane{position:relative;height:40px;background:#fff;border-radius:10px}
.axis{position:relative;height:16px;color:var(--muted);font-size:11px}.axis span{position:absolute;transform:translateX(-50%)}
.shift{position:absolute;top:4px;bottom:4px;min-width:0;border-radius:9px;border:0;background:var(--accent);color:#fff;padding:2px 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:11px;font-weight:700;text-align:left}
.shift.verified{background:#3d2263;color:#fff}.shift.upcoming{background:#fff;color:var(--accent);border:2px solid var(--accent)}
.shift.alert{background:#fff2df;color:#733b0f;border:2px solid #d9963f}
.shift.open{background:repeating-linear-gradient(45deg,#fff,#fff 6px,#eadcf7 6px,#eadcf7 12px);color:var(--accent);border:2px dashed var(--accent)}
.now{position:absolute;top:-4px;bottom:-4px;width:2px;background:#b42318;z-index:1}
.cols{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:10px;align-items:end;height:160px;border-bottom:2px solid #cdbfe0;padding-top:6px}
.col{display:flex;flex-direction:column-reverse;height:100%;min-width:0}
.col i{display:block}
.col-labels{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:10px;font-size:11px;text-align:center;margin-top:5px;color:var(--muted)}
.col-labels b{display:block;color:var(--ink)}
.stack{display:flex;height:28px;border-radius:14px;overflow:hidden;background:#fff}
.stack i{display:block;height:100%}
.dots{display:inline-flex;gap:3px;vertical-align:middle}.dots i{width:11px;height:11px;border-radius:50%;background:var(--accent);display:inline-block}.dots i.extra{background:#d9963f}
.person{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:9px 0;border-top:1px solid #ddd0ec;font-size:13px;align-items:center}
.person p{font-size:12px;color:var(--muted);margin-top:2px}
.visit{background:#fff;border-radius:14px;padding:14px;margin:10px 0}.visit .big{font-size:26px}.visit p{font-size:13px;margin:5px 0}
/* Owner and controller headline: revenue billed year to date and industry drivers */
.title-right{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.ytd{display:flex;gap:10px;flex-wrap:wrap}
.ytd-box{border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:6px;padding:9px 14px;min-width:210px;background:#fff}
.ytd-box span,.kpi span{display:block;font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.ytd-box strong{display:block;font-size:30px;line-height:1.15;letter-spacing:-.6px}
.ytd-box small,.kpi small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.ytd-box b.up{color:#1d6b3a}.ytd-box b.down{color:#a12b1b}
.ytd-box button,.kpi button{padding:0;border:0;border-radius:0;background:transparent;color:var(--accent);font-size:11px;text-decoration:underline;margin-top:5px}
.kpi-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 14px}
.kpi{border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:6px;padding:11px 14px;min-width:0}
.kpi strong{display:block;font-size:27px;line-height:1.2;letter-spacing:-.5px}

p><p>Changing company or role resets filters but keeps corrections made on this page. The Reset button undoes every change made on this page; reloading does the same.</p></details></section>`;

  /* ---------- Saltbox Roofing: projects, claims, crews, weather ---------- */
  function forecastFor(s, date) { return s.company.forecast.find(f => f.date === date || f[0] === date); }

    const item = (crew, d) => {

  function ring(frac) {

    return `<svg class="ring" viewBox="0 0 76 76" aria-hidden="true"><circle cx="38" cy="38" r="${r}" fill="none" style="stroke:#e6dcf1" stroke-width="9"/><circle cx="38" cy="38" r="${r}" fill="none" style="stroke:var(--accent)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(f * C).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 38 38)"/><text x="38" y="44" text-anchor="middle">${frac == null ? '—' : `${Math.round(frac * 100)}%`}</text></svg>`;
  }
  function ringMetric(title, frac, value, note, key, source, showRing = true) {
    return `<div class="metric${showRing ? '' : ' plain'}">${showRing ? ring(frac) : ''}<div><span>${esc(title)}</span><strong>${esc(value)}</strong><span class="muted small">${esc(note)}</span><button type="button" data-action="lineage" data-id="${key}" data-source="${source}">How calculated</button></div></div>`;
  }

  const monthName = (m, long = false) => new Date(`${m}-15T12:00:00Z`).toLocaleDateString('en-US', long ? { month: 'short', year: 'numeric', timeZone: 'UTC' } : { month: 'short', timeZone: 'UTC' });

    showDialog('How calculated', `<p><strong>Source:</strong> ${esc(map.type)}</p><p><strong>Required fields:</strong> ${esc(map.fields.join(', '))}</p><p><strong>Calculation:</strong> ${esc((s.company.metricDefinitions || {})[key] || data.metricDefinitions[key] || 'Count/sum the selected scheduled job records and preserve accepted scope only; late = start time before now with no arrival event.')}</p><p><strong>Period:</strong> ${String(key).startsWith('hl') ? esc(headlinePeriod(s, key)) : key === 'receivables' ? 'All invoices as of Oct 7, noon, independent of selected flow period.' : esc(period)}</p><p><strong>Cadence:</strong> ${esc(map.cadence)}</p><p><strong>Last refresh:</strong> ${esc(when(map.refreshedAt))}</p><p><strong>Review notes:</strong> ${esc(map.review)}</p><p><strong>Decision supported:</strong> ${esc({ owner: 'Prioritize follow-up and check missing costs before interpreting business health.', finance: 'Identify unpaid invoices and unresolved accounting records.', operations: 'Assign visits and review uncertain scope before dispatch.', field: 'Review only this worker/crew’s approved visits and required evidence.' }[current.role] || 'Choose a company dashboard.')}</p><h3>Underlying records</h3><pre>${esc(JSON.stringify(records, null, 2))}</pre>`);
  }
  main.addEventListener('click', e => {
    const target = e.target.closest('[data-action]'); if (!target) return;
    detailTrigger = target;
    const action = target.dataset.action; const id = target.dataset.id;
    const s = states[current.company || galleryCompany]; const m = api.metrics(s, filters.period);
    if (action === 'reset') { states = Object.fromEntries(data.companies.map(c => [c.id, api.create(data, c.id)])); filters = api.defaults(states[current.company], current.role); dashboard(); main.focus({ preventScroll: true }); return; }
    if (action === 'confirm') { api.confirm(s, id); dashboard(); main.focus({ preventScroll: true }); return; }
    if (action === 'pending') { recordDetails('Left pending — no changes', s.facts.find(f => f.id === id), 'The correction remains unaccepted. Approved job scope and every financial value are unchanged.'); return; }
    if (action === 'lineage') { lineage(s, id, target.dataset.source); return; }
    if (action === 'rec') { const r = recordsFor(s, id); recordDetails(r.title, r.rows, r.note); return; }
    if (action === 'source') { lineage(s, 'source', id); return; }
    if (action === 'finance-evidence') { lineage(s, 'receivables', 'accounting'); return; }
    if (action === 'field-evidence') { if (s.model === 'roofing') lineage(s, 'today', 'production'); else if (s.model === 'care') lineage(s, 'myhours', 'evv'); else if (s.model === 'landscape') lineage(s, 'route', 'routes'); else lineage(s, 'work', 'jobs'); return; }
    if (action === 'job') {
      const job = s.jobs.find(j => j.id === id);
      const facts = s.facts.filter(f => f.jobId === id);
      const value = current.role === 'field' ? { job, linkedFacts: facts, reviewHistory: s.reviews.filter(r => r.jobId === id) } : { job, invoice: s.invoices.find(i => i.jobId === id), directCost: s.costs.find(c => c.jobId === id), linkedFacts: facts, reviewHistory: s.reviews.filter(r => r.jobId === id) };
      recordDetails('Approved scope and job record', value, 'Scheduling source → call extraction → Philippine review when needed → accepted scope. Pending facts never authorize new work.'); return;
    }
    if (action === 'invoice') { const i = s.invoices.find(i => i.id === id); recordDetails('Invoice and split payments', { invoice: i, payments: s.payments.filter(p => p.invoiceId === id), outstanding: api.outstanding(s, i) }); return; }
    if (action === 'fact') { const f = s.facts.find(f => f.id === id); recordDetails('Transcript → extraction → review → accepted fact', { fact: f, call: s.calls.find(c => c.id === f.callId), history: s.reviews.filter(r => r.factId === id) }, 'Prior accepted value stays empty until a fact is first confirmed.'); return; }
    if (action === 'facts') { recordDetails('Call facts and review history', { facts: s.facts.filter(f => m.bookedRows.some(j => j.id === f.jobId)), history: s.reviews.filter(r => m.bookedRows.some(j => j.id === r.jobId)) }); return; }
    if (action === 'bookings') { recordDetails('Selected-period booking records', m.bookedRows); return; }
    if (action === 'cancelled') { recordDetails('Cancelled bookings', m.bookedRows.filter(j => j.status === 'cancelled'), 'A cancellation record does not show why the customer declined. Deposits are reconciled separately.'); return; }
    if (action === 'transactions') { recordDetails('Selected-period financial flows', { invoices: m.issuedRows, payments: m.paidRows }, 'Invoices use issuedAt; cash uses paidAt. Split payments retain individual stable IDs and are counted once.'); return; }
    if (action === 'costs') { recordDetails('Completed-job direct cost records', m.completedRows.map(j => ({ jobId: j.id, invoice: s.invoices.find(i => i.jobId === j.id), cost: s.costs.find(c => c.jobId === j.id) })), 'Null is unknown. Exclude that job from contribution, retain its missing-cost exception. Contribution is not company net profit.'); return; }
    if (action === 'unfinished') { recordDetails('Deposit / unfinished-work invoices', s.invoices.filter(i => s.jobs.find(j => j.id === i.jobId).status !== 'completed')); return; }
    if (action === 'work') recordDetails('Selected worklist', api.work(s, filters.worker));
  });
  document.getElementById('close-detail').addEventListener('click', () => dialog.close());
  dialog.addEventListener('close', () => { if (opener?.isConnected) opener.focus({ preventScroll: true }); });
  function render(navigation = false) {
    current = api.route(location.hash);
    if (current.page === 'dashboard') { if (navigation) filters = api.defaults(states[current.company], current.role); dashboard(); }
    else if (current.page === 'operations-overview') overview();
    else gallery();
    // Mark the current page in the top bar.
    const here = current.page === 'dashboard' ? '' : current.page === 'operations-overview' ? '#operations-overview' : '#gallery';
    topbar.querySelectorAll('a').forEach(a => { if (a.getAttribute('href') === here) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    if (navigation) { window.scrollTo({ top: 0, behavior: 'instant' }); main.focus({ preventScroll: true }); }
  }
  window.addEventListener('hashchange', () => render(true));
  if (current.page === 'dashboard') filters = api.defaults(states[current.company], current.role);
  render();
})();
</script>
<script>/* Keep column labels visible while the document scrolls past a table.
   Tables retain their existing horizontal scrolling on narrow screens. */
(() => {
  const bar = document.createElement("div");
  bar.id = "sticky-table-header";
  bar.setAttribute("aria-hidden", "true");
  bar.inert = true;
  Object.assign(bar.style, {
    position: "fixed",
    zIndex: "9",
    overflow: "hidden",
    pointerEvents: "none",
    display: "none",
    boxShadow: "0 5px 12px rgba(23, 26, 32, .16)",
  });
  document.body.append(bar);

  let activeTable = null;
  let frame = 0;

  function topClearance() {
    let top = 0;
    for (const element of document.querySelectorAll(".document-header, .topbar, .controls")) {
      const position = getComputedStyle(element).position;
      const rect = element.getBoundingClientRect();
      if ((position === "sticky" || position === "fixed") &&
          rect.top <= top + 32 && rect.bottom > top) {
        top = rect.bottom;
      }
    }
    return Math.max(0, top);
  }

  function horizontalScroller(table) {
    for (let node = table.parentElement; node && node !== document.body; node = node.parentElement) {
      const overflow = getComputedStyle(node).overflowX;
      if (overflow === "auto" || overflow === "scroll") return node;
    }
    return table;
  }

  function copyAppearance(from, to) {
    const style = getComputedStyle(from);
    for (const property of [
      "background-color", "color", "font-family", "font-size", "font-weight",
      "line-height", "letter-spacing", "text-align", "vertical-align",
      "white-space", "padding", "border", "box-sizing",
    ]) {
      to.style.setProperty(property, style.getPropertyValue(property));
    }
  }

  function buildHeader(table) {
    bar.replaceChildren();
    const originalHead = table.tHead;
    const clone = table.cloneNode(false);
    const copiedHead = originalHead.cloneNode(true);
    clone.append(copiedHead);
    clone.style.width = `${table.getBoundingClientRect().width}px`;
    clone.style.tableLayout = "fixed";
    clone.style.borderCollapse = getComputedStyle(table).borderCollapse;
    clone.style.borderSpacing = getComputedStyle(table).borderSpacing;
    clone.style.margin = "0";
    const originalCells = originalHead.querySelectorAll("th, td");
    const copiedCells = copiedHead.querySelectorAll("th, td");
    originalCells.forEach((cell, index) => {
      const copy = copiedCells[index];
      copyAppearance(cell, copy);
      copy.style.width = `${cell.getBoundingClientRect().width}px`;
      copy.style.minWidth = copy.style.width;
      copy.style.maxWidth = copy.style.width;
    });
    bar.append(clone);
  }

  function update() {
    frame = 0;
    const top = topClearance();
    let candidate = null;
    for (const table of document.querySelectorAll("table")) {
      if (!table.tHead || !table.tHead.querySelector("th")) continue;
      const head = table.tHead.getBoundingClientRect();
      const body = table.getBoundingClientRect();
      if (head.height && head.top < top && body.bottom > top + head.height) {
        candidate = table;
      }
    }
    if (!candidate) {
      activeTable = null;
      bar.style.display = "none";
      return;
    }
    const scroller = horizontalScroller(candidate);
    const viewport = scroller.getBoundingClientRect();
    const left = Math.max(0, viewport.left);
    const width = Math.min(window.innerWidth - left, viewport.right - left);
    if (width <= 0) {
      bar.style.display = "none";
      return;
    }
    if (candidate !== activeTable ||
        bar.firstElementChild?.getBoundingClientRect().width !== candidate.getBoundingClientRect().width) {
      buildHeader(candidate);
      activeTable = candidate;
    }
    bar.style.left = `${left}px`;
    bar.style.top = `${top}px`;
    bar.style.width = `${width}px`;
    bar.style.height = `${candidate.tHead.getBoundingClientRect().height}px`;
    bar.firstElementChild.style.marginLeft = `${scroller === candidate ? 0 : -scroller.scrollLeft}px`;
    bar.style.display = "block";
  }

  function schedule() {
    if (!frame) frame = requestAnimationFrame(update);
  }

  document.addEventListener("scroll", schedule, true);
  document.addEventListener("click", schedule);
  window.addEventListener("resize", () => {
    activeTable = null;
    schedule();
  });
  window.addEventListener("hashchange", schedule);
  document.fonts?.ready.then(() => {
    activeTable = null;
    schedule();
  });
  schedule();
})();
</script></body>
